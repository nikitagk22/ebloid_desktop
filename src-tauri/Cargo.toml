[package]
name = "ebloid-desktop"
version = "0.2.1"
description = "Native WebView desktop client for eblo.id"
authors = ["Ebloid"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
rfd = "0.15"
serde_json = "1"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
url = "2"
